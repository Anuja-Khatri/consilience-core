# Reference: AlphaEvolve's packing (alphaevolve_results @ 4226acb, B.12 data cell 118).
kind: evaluator-contract
name: codeevolve/circle_packing_square (n=26)
description: 26 disjoint circles (x, y, r), r >= 0, inside the unit square; maximise the sum of radii.
harness:
  kind: cli_json
  evaluator: evaluate.py
  program_function: circle_packing26
  argv: ['{python}', '{evaluator}', '{program}', '{outdir}/results.json']
  result_file: '{outdir}/results.json'
  score_key: benchmark_ratio
  timeout_s: 60
dims: {n: 26}
fields:
- name: circles
  type: real_array
  shape: [n, 3]
  role: construction
validity:
- {rule: finite, field: circles}
- rule: shape
  field: circles
  shape: [n, 3]
- {rule: predicate, call: packing, name: packing_in_unit_square}
invariances:
- {transform: permute, field: circles}
score:
  direction: maximize
  record: {value: '2.6358627564136983', quantity: radii_sum, map: ratio, kind: best_known, source: 'CodeEvolve README
      (problem page): ''radii_sum > 2.6358627564136983 (AlphaEvolve''s reported best)'''}
reference: {file: reference.npz}
glue: glue.py
contract_author: model
