# Reference: AlphaEvolve's packing (alphaevolve_results @ 4226acb, B.13 data cell 125).
kind: evaluator-contract
name: codeevolve/circle_packing_rect (n=21)
description: 21 disjoint circles (x, y, r) inside some rectangle of perimeter 4; maximise the sum of radii.
harness:
  kind: cli_json
  evaluator: evaluate.py
  program_function: circle_packing21
  argv: ['{python}', '{evaluator}', '{program}', '{outdir}/results.json']
  result_file: '{outdir}/results.json'
  score_key: benchmark_ratio
  timeout_s: 60
dims: {n: 21}
fields:
- name: circles
  type: real_array
  shape: [n, 3]
  role: construction
validity:
- {rule: finite, field: circles}
- rule: shape
  field: circles
  shape: [n, 3]
- {rule: predicate, call: packing, name: packing_in_perimeter4_rectangle}
invariances:
- {transform: permute, field: circles}
score:
  direction: maximize
  record: {value: '2.365', quantity: radii_sum, map: ratio, kind: best_known, source: 'AlphaEvolve, alphaevolve_results
      @ 4226acb mathematical_results.ipynb B.13 text: n=21 improved to 2.365 (as published); mapped through the
      evaluator''s BENCHMARK'}
reference: {file: reference.npz}
glue: glue.py
contract_author: model
