kind: evaluator-contract
name: openevolve/erdos_min_overlap @ ac5f8f5
description: >
  AlphaEvolve Appendix B.5 (README, config.yaml): a step function h on [0, 2] with n equal steps,
  0 <= h <= 1 and int h = 1; C5(h) = max_k int h(x) (1 - h)(x + k) dx, smaller is better (an upper
  bound on C5). run() returns (h, c5, n); c5 is a self-report (claimed; the scorer now scores its own
  recomputation, #562), n is len(h). Score = BENCHMARK / c5.
contract_author: model
harness:
  kind: py_path
  evaluator: evaluator.py
  entry: evaluate
  program_function: run
  score_key: combined_score
  reject: {keys_present: [error]}
  timeout_s: 60
fields:
  - {name: h, type: real_array, role: construction}
  - {name: c5, type: real, role: claimed, quantity: c5}
  - {name: n, type: int, role: derived, from: "len(h)"}
returns: [h, c5, n]
validity:
  - {rule: finite, field: h}
  - {rule: range, field: h, min: "0", max: "1"}
  - {rule: predicate, call: integral_one, name: integral_one, equality: true, tolerance: "1e-12"}
score:
  direction: maximize
  record:
    value: "1.00000"
    kind: best_known
    source: "evaluator BENCHMARK 0.38092303510845016 (AlphaEvolve, config.yaml) -> combined_score 1; published as C5 <= 0.380924 (6 significant digits; DM problem page 5), so 6 significant digits here (the pilot used 1.0000)"
reference: {file: reference.npz}
glue: glue.py
