kind: evaluator-contract
name: openevolve/third_autocorr_ineq @ ac5f8f5
description: >
  AlphaEvolve Appendix B.3 (README, config.yaml): a real step function f (may be negative) with n equal
  steps on [-1/4, 1/4]; C3(f) = max_t |(f*f)(t)| / (int f)^2, smaller is better. run() returns
  (f, c3, loss, n); c3 is a self-report (claimed), n is len(f), loss is not part of the problem.
  Score = BENCHMARK / c3.
contract_author: model
harness:
  kind: py_path
  evaluator: evaluator.py
  entry: evaluate
  program_function: run
  score_key: combined_score
  reject: {keys_present: [error]}
  timeout_s: 60
fields:
  - {name: f, type: real_array, role: construction}
  - {name: c, type: real, role: claimed, quantity: c3}
  - {name: loss, type: real, role: fixed, value: 0.0}
  - {name: n, type: int, role: derived, from: "len(f)"}
returns: [f, c, loss, n]
validity:
  - {rule: finite, field: f}
  - {rule: predicate, call: nonzero_integral, name: nonzero_integral}
invariances:
  - {transform: scale, field: f, score_exponent: 0}
  - {transform: negate, field: f}
score:
  direction: maximize
  record:
    value: "1.0000"
    kind: best_known
    source: "evaluator BENCHMARK 1.4556427953745406 (AlphaEvolve upper bound, config.yaml) -> combined_score 1; published as C3 <= 1.4557 (4 decimals)"
reference: {file: reference.npz}
glue: glue.py
