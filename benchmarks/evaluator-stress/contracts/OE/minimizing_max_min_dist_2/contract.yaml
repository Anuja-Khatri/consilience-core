kind: evaluator-contract
name: openevolve/minimizing_max_min_dist/2 (n=16, d=2) @ ac5f8f5
description: >
  AlphaEvolve Appendix B.8 (README, config.yaml, initial_program docstring): 16 distinct points in R^2;
  minimise the ratio of maximum to minimum pairwise distance. The scorer outputs
  (min/max)^2 / BENCHMARK, BENCHMARK = 1/12.889266112 (larger is better).
contract_author: model
harness:
  kind: py_path
  evaluator: evaluator.py
  entry: evaluate
  program_function: min_max_dist_dim2_16
  score_key: combined_score
  reject: {keys_present: [error]}
  timeout_s: 60
fields:
  - {name: points, type: real_array, shape: [16, 2], role: construction}
validity:
  - {rule: finite, field: points}
  - {rule: shape, field: points, shape: [16, 2]}
  - {rule: distinct, field: points}
invariances:
  - {transform: permute, field: points}
  - {transform: translate, field: points}
  - {transform: rotate, field: points, dims: 2}
  - {transform: scale, field: points, score_exponent: 0}
  - {transform: reflect, field: points}
score:
  direction: maximize
  record:
    quantity: ratio_squared
    value: "12.889266112"
    map: score_from_ratio_squared
    kind: best_known
    source: "AlphaEvolve (max/min distance)^2 ~ 12.889266112 for n = 16, d = 2 (alphaevolve_results mathematical_results.ipynb markdown, B.8); map = (1/ratio^2) / evaluator BENCHMARK (1/12.889266112)"
reference: {file: reference.npz}
initial: {file: initial.npz}
glue: glue.py
