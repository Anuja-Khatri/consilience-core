kind: evaluator-contract
name: openevolve/first_autocorr_ineq @ ac5f8f5
description: >
  AlphaEvolve Appendix B.1 (README, config.yaml): a non-negative step function f with n equal steps on
  [-1/4, 1/4]; C1(f) = max_t (f*f)(t) / (int f)^2, smaller is better. run() returns (f, c1, loss, n);
  c1 is a self-report (claimed, recomputed by glue), n is len(f), loss is not part of the problem.
  Score = BENCHMARK / c1.
contract_author: model
harness:
  kind: py_path
  evaluator: evaluator.py
  entry: evaluate
  program_function: run
  score_key: combined_score
  reject: {keys_present: [error]}
  timeout_s: 60
fields:
  - {name: f, type: real_array, role: construction}
  - {name: c, type: real, role: claimed, quantity: c1}
  - {name: loss, type: real, role: fixed, value: 0.0}
  - {name: n, type: int, role: derived, from: "len(f)"}
returns: [f, c, loss, n]
validity:
  - {rule: finite, field: f}
  - {rule: range, field: f, min: "0"}
  - {rule: predicate, call: positive_integral, name: positive_integral}
invariances:
  - {transform: scale, field: f, score_exponent: 0}
score:
  direction: maximize
  record:
    quantity: c1
    value: "1.5053"
    map: score_from_c1
    kind: best_known
    source: "AlphaEvolve C1 <= 1.5053 (alphaevolve_results mathematical_results.ipynb markdown, B.1); map = evaluator BENCHMARK 1.5052939684401607 / c1"
reference: {file: reference.npz}
glue: glue.py
