kind: evaluator-contract
name: openevolve/uncertainty_ineq @ ac5f8f5
description: >
  AlphaEvolve Appendix B.4 (README, config.yaml): even f = P(x) exp(-x^2/2), P a combination of
  Hermite polynomials H_0, H_4, ..., H_{4(m-1)} plus a forced H_{4m} term making P(0) = 0;
  C4 = r_max^2 / (2 pi), r_max the largest positive sign change of P; smaller is better.
  run() returns (coeffs, c4_bound, r_max); c4_bound and r_max are self-reports (claimed), recomputed
  by glue in exact rational arithmetic. The number m of free coefficients is not fixed by the problem.
  Score = BENCHMARK / c4.
contract_author: model
harness:
  kind: py_path
  evaluator: evaluator.py
  entry: evaluate
  program_function: run
  score_key: combined_score
  reject: {keys_present: [error]}
  timeout_s: 120
fields:
  - {name: coeffs, type: real_array, role: construction}
  - {name: c4_bound, type: real, role: claimed, quantity: c4}
  - {name: r_max, type: real, role: claimed, quantity: r_max}
returns: [coeffs, c4_bound, r_max]
validity:
  - {rule: finite, field: coeffs}
  - {rule: count, field: coeffs, min: 1}
  - {rule: predicate, call: sign_change, name: sign_change}
invariances:
  - {transform: scale, field: coeffs, score_exponent: 0}
score:
  direction: maximize
  record:
    value: "1.0000"
    kind: best_known
    source: "evaluator BENCHMARK 0.3215872333529007 (config.yaml) -> combined_score 1. DM problem page 11 lists the AlphaEvolve bound (14 May 2025) as 0.321591, which maps to 0.99999; 4 decimals cover both"
reference: {file: reference.npz}
glue: glue.py
