# Label DM-16 (pre, 8f44745): https://github.com/google-deepmind/alphaevolve_repository_of_problems/issues/16
# Validity from the notebook's problem statement (problem 55) and prompt. No record stated for n=10: omitted.
# reference: 8 squares of side 1/3 and 2 of side 1/6 (sum 3), sides lowered by one ulp so the packing is exact.
# claimed_best: the notebook's evolved_squares_layout_10 (code cell 1).
kind: evaluator-contract
name: deepmind/squares_in_square evaluate_squares_in_square (n=10) [DM-16 pre]
description: 'Problem 55: n squares with disjoint interiors inside the unit square, maximise the sum of side lengths.
  The notebook''s encoding is axis-parallel squares (centers, sides); n = 10 as in its verification cell.'
harness: {kind: function, evaluator: scorer.py, entry: evaluate_squares_in_square, timeout_s: 30}
dims: {n: 10}
fields:
- name: centers
  type: real_array
  shape: [n, 2]
  role: construction
- name: sides
  type: real_array
  shape: [n]
  role: construction
validity:
- {rule: finite, field: centers}
- rule: shape
  field: centers
  shape: [n, 2]
- {rule: finite, field: sides}
- rule: shape
  field: sides
  shape: [n]
- {rule: range, field: sides, min: '0'}
- {rule: predicate, call: squares, name: positive_squares_inside_and_disjoint}
invariances:
- transform: dihedral
  field: centers
  order: 4
  center: ['0.5', '0.5']
score: {direction: maximize}
reference: {file: reference.npz}
claimed_best: {file: claimed_best.npz}
contract_author: model
glue: glue.py
