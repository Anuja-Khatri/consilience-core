# Label DM-14 (pre only, 8f44745): https://github.com/google-deepmind/alphaevolve_repository_of_problems/issues/14 - calculate_design_score (code cell 0) and the verification
# condition in code cell 1. No fix is known (positive only).
# Reference: the notebook's spherical_design_215120 (code cell 1).
kind: evaluator-contract
name: deepmind/spherical_t_designs calculate_design_score (d=2, t=15, N=120) [DM-14 pre]
description: 'Problem 32: N points on the unit sphere S^d forming (or best approximating) a spherical t-design.
  Scorer returns minus the design error (0 for an exact design).'
harness:
  kind: function
  evaluator: scorer.py
  entry: calculate_design_score
  reject:
    values: [-1000000.0]
  timeout_s: 60
dims: {N: 120, D: 3}
fields:
- name: X
  type: real_array
  shape: [N, D]
  role: construction
validity:
- {rule: finite, field: X}
- rule: shape
  field: X
  shape: [N, D]
- {rule: norm, field: X, axis: 1, equals: '1', tolerance: 1e-12}
invariances:
- {transform: permute, field: X}
- {transform: rotate, field: X, dims: 3}
- {transform: negate, field: X}
score:
  direction: maximize
  record: {value: '-0.00000001', kind: threshold, success: '>', margin: '0', source: 'notebook data cell (code cell
      1): a set is reported a ''correct numerical construction'' when its design error is below 1e-8 (score > -1e-8)'}
  bound: {value: '0', kind: proven, source: 'the score is minus a sum over k of dim_k/C_k(1) * sum_ij C_k(<x_i,x_j>),
      each term >= 0 by the addition theorem (positive-definite Gegenbauer kernels)'}
reference: {file: reference.npz}
glue: glue.py
contract_author: model
