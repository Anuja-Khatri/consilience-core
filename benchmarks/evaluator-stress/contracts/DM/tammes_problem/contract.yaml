kind: evaluator-contract
name: deepmind/tammes_problem get_score (N = 12)
description: >
  Problem 34 (Tammes problem): the largest possible minimum pairwise distance of N points on the
  unit sphere S^2. get_score (code cell 1) normalises the points and returns the minimum pairwise
  distance. N is not an argument of the scorer, so the point count is a caller-enforced fact.
  The notebook ships configurations for N = 3, 7, 12, 25, 32, 50, 100, 200 (code cell 2); this
  contract fixes N = 12, whose optimum (the icosahedron) is proven. The reference is the shipped
  N = 12 configuration renormalised; the raw shipped points are claimed_best.
contract_author: model
harness:
  kind: function
  evaluator: scorer.py
  entry: get_score
  reject:
    values:
    - -10000000000.0
fields:
- name: X
  type: real_array
  role: construction
validity:
- rule: finite
  field: X
- rule: norm
  field: X
  axis: 1
  equals: '1'
  tolerance: '1e-12'
caller_enforced:
- rule: shape
  field: X
  shape: [12, 3]
invariances:
- transform: permute
  field: X
- transform: rotate
  field: X
  dims: 3
- transform: negate
  field: X
score:
  direction: maximize
  record:
    value: '1.0514622242382672'
    kind: best_known
    source: Tammes problem for N = 12 is solved (Fejes Toth 1943; the regular icosahedron), minimum distance
      4 / sqrt(10 + 2 sqrt 5) = 1.05146222423826721...; the notebook's shipped N = 12 configuration attains it
  bound:
    value: '1.0514622242382673'
    kind: proven
    source: optimality of the icosahedron for N = 12 (Fejes Toth 1943), written rounded up
reference:
  file: reference.npz
claimed_best:
  file: claimed_best.npz
glue: glue.py
