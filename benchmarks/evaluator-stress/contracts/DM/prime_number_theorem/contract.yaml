kind: evaluator-contract
name: deepmind/prime_number_theorem evaluate_partial_function (num_samples = 10_000_000)
description: >
  Problem 27 (constants in the prime number theorem). The notebook searches for Chebyshev-type
  partial functions a: S -> R on positive integers. evaluate_partial_function (code cell 2) sets
  a_1 so that sum a_k / k = 0, checks sum a_k floor(x/k) <= 1.0001 on random samples x, and returns
  -sum a_k log k / k, a lower bound for C^- when the condition holds for all x >= 1 (the valid answer
  required here: no tolerance, every x). The scorer samples with an unseeded generator, so it is
  non-deterministic. Function values are clipped to [-10, 10] by the scorer (stated in the prompt),
  so a valid answer has values in that range. The reference is Chebyshev's classical function
  {1: 1, 2: -1, 3: -1, 5: -1, 30: 1} (0.92129...). Keys and values are paired fields, so no
  permutation invariance can be declared.
contract_author: model
harness:
  kind: function
  evaluator: scorer.py
  entry: evaluate_partial_function
  timeout_s: 60
fields:
- name: k
  type: int_array
  role: construction
- name: v
  type: real_array
  role: construction
validity:
- rule: finite
  field: k
- rule: integral
  field: k
- rule: range
  field: k
  min: '1'
- rule: distinct
  field: k
- rule: count
  field: k
  min: 1
- rule: finite
  field: v
- rule: range
  field: v
  min: '-10'
  max: '10'
- rule: predicate
  call: same_length
  name: keys_and_values_paired
- rule: predicate
  call: chebyshev_condition
  name: floor_sum_at_most_1_for_all_x
score:
  direction: maximize
  bound:
    value: '1'
    kind: proven
    source: prime number theorem, C^- = C^+ = 1 (problem page 27); a valid partial function gives a lower
      bound for C^-, and the prompt calls 1.0 the optimal score
reference:
  file: reference.npz
glue: glue.py
