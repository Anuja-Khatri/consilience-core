kind: evaluator-contract
name: deepmind/sums_differences_problems get_score (problem 42, code cell 0)
description: >
  Problem 42: C = least constant with |A+A|/|A| <= (|A-A|/|A|)^C for every non-empty finite set A of
  integers. Construction = a finite set A of integers (|A| >= 2). Score = log(|A+A|/|A|) / log(|A-A|/|A|),
  a lower bound on C. Scorer = the 'Data and verification' cell (code cell 0), not the tie-broken
  variant of code cell 3.
contract_author: model
harness:
  kind: function
  evaluator: scorer.py
  entry: get_score
  timeout_s: 60
  reject:
    values: [0.0]
fields:
  - {name: A, type: int_set, role: construction}
validity:
  - {rule: finite, field: A}
  - {rule: count, field: A, min: 2}
  - {rule: integral, field: A}
  - {rule: distinct, field: A}
invariances:
  - {transform: permute, field: A}
  - {transform: translate, field: A}
  - {transform: negate, field: A}
  - {transform: scale, field: A, score_exponent: 0}
score:
  direction: maximize
reference: {file: reference.npz}
glue: glue.py
