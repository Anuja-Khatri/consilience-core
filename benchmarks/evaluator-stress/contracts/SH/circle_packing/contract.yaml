# Validity from examples/circle_packing/README.md ('pack n=26 circles in a unit square, maximize sum of radii') and
# evaluate.py's docstring. Reference: AlphaEvolve's n=26 packing (alphaevolve_results @ 4226acb, B.12 cell 118), split into
# centers/radii. The argv shim (inline, so hashed with the contract) stands in for the shinka package __init__ files;
# the two vendored shinka modules it loads are listed in harness.extra_files.
kind: evaluator-contract
name: shinka/circle_packing (n=26)
description: 26 disjoint circles in the unit square, maximise the sum of radii; run_packing returns (centers, radii,
  reported_sum).
harness:
  kind: cli_json
  evaluator: evaluate.py
  program_function: run_packing
  argv:
  - '{python}'
  - -c
  - |
    import os, sys, types, runpy, importlib.util
    ev, prog, outdir = sys.argv[1:4]
    here = os.path.dirname(os.path.abspath(ev))
    def load(name, rel):
        spec = importlib.util.spec_from_file_location(name, os.path.join(here, rel))
        m = importlib.util.module_from_spec(spec); sys.modules[name] = m; spec.loader.exec_module(m); return m
    # The published shinka/__init__.py and shinka/core/__init__.py import the whole LLM stack; stand in empty packages
    # and load the two vendored, unmodified modules the evaluator needs (wrap_eval.run_shinka_eval and its eval_stop import).
    for p in ('shinka', 'shinka.core', 'shinka.utils'):
        m = types.ModuleType(p); m.__path__ = []; sys.modules[p] = m
    load('shinka.utils.eval_stop', 'shinka_vendored/utils/eval_stop.py')
    sys.modules['shinka.core'].run_shinka_eval = load('shinka.core.wrap_eval', 'shinka_vendored/core/wrap_eval.py').run_shinka_eval
    sys.argv = [ev, '--program_path', prog, '--results_dir', outdir]
    runpy.run_path(ev, run_name='__main__')
  - '{evaluator}'
  - '{program}'
  - '{outdir}'
  result_file: '{outdir}/metrics.json'
  score_key: combined_score
  reject:
    file: {path: '{outdir}/correct.json', key: correct, equals: false}
  extra_files: [shinka_vendored/core/wrap_eval.py, shinka_vendored/utils/eval_stop.py]
  timeout_s: 60
dims: {n: 26}
fields:
- name: centers
  type: real_array
  shape: [n, 2]
  role: construction
- name: radii
  type: real_array
  shape: [n]
  role: construction
- {name: reported_sum, type: real, role: claimed, quantity: sum_radii}
returns: [centers, radii, reported_sum]
validity:
- {rule: finite, field: centers}
- rule: shape
  field: centers
  shape: [n, 2]
- {rule: finite, field: radii}
- rule: shape
  field: radii
  shape: [n]
- {rule: range, field: radii, min: '0'}
- rule: in_box
  field: centers
  box:
  - ['0', '1']
  - ['0', '1']
  margin_from: radii
- {rule: pairwise_separation, field: centers, radii_from: radii}
invariances:
- transform: dihedral
  field: centers
  order: 4
  center: ['0.5', '0.5']
score:
  direction: maximize
  record: {value: '2.635', kind: best_known, source: 'AlphaEvolve (Novikov et al. 2025), alphaevolve_results @ 4226acb
      B.12: n=26 sum of radii 2.635 (stated to 3 decimals)'}
reference: {file: reference.npz}
glue: glue.py
contract_author: model
