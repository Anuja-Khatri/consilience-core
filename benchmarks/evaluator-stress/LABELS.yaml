# Labelled known bugs (spec v1.0 §10.2), written before any benchmark run.
# pre: the contract on the buggy code (a labelled POSITIVE: recall M1). post: the contract on the fixed code
# (a labelled NEGATIVE for this bug: M2(b) counts a matching finding there as a false alarm).
# match: a BLOCK counts as catching the bug if its kind is listed AND (when `rules` is given) its broken rules include
# one of them. Commits and links: SOURCES.yaml.
labels:
