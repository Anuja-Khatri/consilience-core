[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "consilience"
version = "0.3.0.dev0"
description = "Compare two measurements with units and conditions, and check a table against written limits. Refuses what it cannot read; every result has a receipt you can re-run."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT AND CC-BY-4.0"
license-files = ["LICENSE", "LICENSE-DATA"]
authors = [{ name = "Anuja Khatri" }]
keywords = ["measurement", "units", "comparison", "data quality", "validation",
            "reproducibility", "electrochemistry", "receipts", "evaluator", "reward hacking"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
]
# The core (compare, check, verify) needs only these two.
dependencies = [
  "pint>=0.23",
  "pyyaml>=6",
]

[project.optional-dependencies]
# `consilience stress` (check scoring code before optimising against it) needs numpy.
stress = ["numpy>=1.24"]
# The nanopublication exporter (`consilience export`, `agent`, `templates`), used from a
# source checkout of consilience-core. nanopub itself needs Python 3.12 or newer.
nanopub = ["nanopub>=2.2.2,<3; python_version >= '3.12'",
           "rdflib>=7.0; python_version >= '3.12'"]
test = ["pytest>=8", "numpy>=1.24", "nanopub>=2.2.2,<3; python_version >= '3.12'",
        "rdflib>=7.0; python_version >= '3.12'"]
dev = ["pytest>=8", "numpy>=1.24", "nanopub>=2.2.2,<3; python_version >= '3.12'",
       "rdflib>=7.0; python_version >= '3.12'", "build", "twine"]

[project.scripts]
consilience = "consilience.cli:main"

[project.urls]
Homepage = "https://github.com/Anuja-Khatri/consilience-core"
Source = "https://github.com/Anuja-Khatri/consilience-core"
Issues = "https://github.com/Anuja-Khatri/consilience-core/issues"
Changelog = "https://github.com/Anuja-Khatri/consilience-core/blob/v0.1.1/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"consilience" = ["data/packs/*.yaml", "data/maps/*.yaml", "data/examples/*.json", "data/examples/*.csv",
                 "data/examples/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
